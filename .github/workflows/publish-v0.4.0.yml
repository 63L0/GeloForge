name: Publish GeloForge v0.4.0 (one-time)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: geloforge-v0.4.0-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == '63L0/GeloForge'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out exact successful main CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify exact commit, latest main and release metadata
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{ print $1 }')" = "$VERIFIED_SHA" || {
            echo "::error::CI ran on an out-of-date main commit"; exit 1;
          }
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const compat = JSON.parse(fs.readFileSync('core/compatibility.json', 'utf8'));
          const v = fs.readFileSync('VERSION', 'utf8').trim();
          if (v !== '0.4.0' || pkg.version !== v || compat.harness_version !== v || pkg.private !== true) {
            throw new Error('Release version metadata failed consistency checks');
          }
          NODE
          test -s docs/release-notes-v0.4.0.md

      - name: Publish annotated tag and GitHub Release (never overwrite)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: 63L0/GeloForge
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.4.0 >/dev/null 2>&1; then
            echo "v0.4.0 release already exists; refusing to overwrite"
            exit 0
          fi
          if git ls-remote --tags origin refs/tags/v0.4.0 | grep -q refs/tags/v0.4.0; then
            git fetch origin tag v0.4.0
            actual="$(git rev-parse 'v0.4.0^{commit}')"
            test "$actual" = "$VERIFIED_SHA" || {
              echo "::error::Existing v0.4.0 tag does not match verified commit"; exit 1;
            }
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a v0.4.0 "$VERIFIED_SHA" -m 'GeloForge v0.4.0'
            git push origin refs/tags/v0.4.0
          fi
          gh release create v0.4.0 --verify-tag --title 'GeloForge v0.4.0' --notes-file docs/release-notes-v0.4.0.md --latest
