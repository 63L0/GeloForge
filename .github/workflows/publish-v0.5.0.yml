name: Publish GeloForge v0.5.0 (one-time)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: geloforge-v0.5.0-publish
  cancel-in-progress: false

jobs:
  publish:
    # Only successful CI from a main push in this repository; never use PR results.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == '63L0/GeloForge' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out exact successful main CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify main head, version, source-only policy and release notes
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA" || {
            echo "::error::Checkout does not match successful main push CI SHA"; exit 1;
          }
          test "$(git ls-remote origin refs/heads/main | awk '{ print $1 }')" = "$VERIFIED_SHA" || {
            echo "::error::CI result is not for latest main commit"; exit 1;
          }
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const compat = JSON.parse(fs.readFileSync('core/compatibility.json', 'utf8'));
          const version = fs.readFileSync('VERSION', 'utf8').trim();
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const expected = '0.5.0';
          if (version !== expected || pkg.version !== expected || compat.harness_version !== expected) {
            throw new Error('GeloForge v0.5.0 release version metadata mismatch');
          }
          if (pkg.private !== true || Object.keys(pkg.dependencies || {}).length !== 0) {
            throw new Error('GeloForge must remain a private-to-npm, zero-runtime-dependency source release');
          }
          if (!Array.isArray(compat.supported_schema_versions) ||
              !['1.0','1.1'].every(v => compat.supported_schema_versions.includes(v))) {
            throw new Error('Legacy schema compatibility missing');
          }
          if (!changelog.includes('## [0.5.0] — 2026-11-20') ||
              changelog.includes('## [0.5.0] — Unreleased')) {
            throw new Error('Changelog v0.5.0 release date has not been finalized');
          }
          if (!fs.statSync('docs/release-notes-v0.5.0.md').size) {
            throw new Error('Missing release notes');
          }
          if (!fs.statSync('scripts/smoke-fresh-install.mjs').size) {
            throw new Error('Missing fresh-checkout smoke test');
          }
          NODE

      - name: Verify prior release tags are untouched
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          test "$(git rev-parse 'v0.3.0^{commit}')" = 'c63a3c0a56be409a4dc8df38f2fa9cff63d62118' || {
            echo "::error::Previously published v0.3.0 tag moved"; exit 1;
          }
          test "$(git rev-parse 'v0.4.0^{commit}')" = 'a8f4ee680eda6c404d3d6cc7de6cd2d577d6d006' || {
            echo "::error::Previously published v0.4.0 tag moved"; exit 1;
          }

      - name: Create immutable v0.5.0 tag and source GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: 63L0/GeloForge
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Fail closed on a conflicting existing tag; never move or overwrite tags/releases.
          if git ls-remote --tags origin refs/tags/v0.5.0 | grep -q refs/tags/v0.5.0; then
            git fetch origin tag v0.5.0
            actual="$(git rev-parse 'v0.5.0^{commit}')"
            test "$actual" = "$VERIFIED_SHA" || {
              echo "::error::Existing v0.5.0 tag points to a different commit"; exit 1;
            }
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a v0.5.0 "$VERIFIED_SHA" -m 'GeloForge v0.5.0'
            git push origin refs/tags/v0.5.0
          fi

          if gh release view v0.5.0 >/dev/null 2>&1; then
            echo "v0.5.0 GitHub Release already exists. Leaving it unchanged."
            exit 0
          fi
          gh release create v0.5.0 --verify-tag --title 'GeloForge v0.5.0' \
            --notes-file docs/release-notes-v0.5.0.md --latest
          gh release view v0.5.0 --json name,tagName,url
