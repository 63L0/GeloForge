name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

jobs:
  test-and-benchmark:
    name: ${{ matrix.os }} (Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ["20", "22"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Configure Git identity for temporary fixture commits
        run: |
          git config --global user.name "GeloForge CI"
          git config --global user.email "ci@example.invalid"

      - name: Run GeloForge test suite
        run: npm test

      - name: Run deterministic benchmarks
        run: npm run benchmark

      - name: Fresh-checkout CLI installation and smoke test
        run: |
          npm link --ignore-scripts --no-audit --no-fund
          geloforge --version
          node scripts/smoke-fresh-install.mjs
